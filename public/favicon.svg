<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      /* Light Mode Defaults */
      :root {
        --bg-start: #f8fafc;
        --bg-end: #e2e8f0;
        --border-color: #cbd5e1;
        --grid-line: #0f172a;
        --grid-opacity: 0.05;
        --node-base: #ffffff;
        --node-ring: #0284c7;
        --core-bg: #f1f5f9;
        --core-ring: #2563eb;
        --core-pip: #0284c7;
        --track-stop-1: #0284c7;
        --track-stop-2: #2563eb;
        --track-stop-3: #7c3aed;
      }

      /* Dark Mode Overrides */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-start: #0f172a;
          --bg-end: #020617;
          --border-color: #1e293b;
          --grid-line: #ffffff;
          --grid-opacity: 0.08;
          --node-base: #0f172a;
          --node-ring: #38bdf8;
          --core-bg: #090d16;
          --core-ring: #60a5fa;
          --core-pip: #38bdf8;
          --track-stop-1: #06b6d4;
          --track-stop-2: #3b82f6;
          --track-stop-3: #8b5cf6;
        }
      }

      .bg { fill: url(#bgGrad); stroke: var(--border-color); }
      .grid { stroke: var(--grid-line); opacity: var(--grid-opacity); }
      .node-disc { fill: var(--node-base); stroke: var(--node-ring); }
      .core-outer { fill: var(--core-bg); stroke: var(--core-ring); }
      .core-inner { fill: var(--core-pip); }
    </style>

    <!-- Gradients driven by CSS Variables -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-start)" />
      <stop offset="100%" stop-color="var(--bg-end)" />
    </linearGradient>

    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--track-stop-1)" />
      <stop offset="50%" stop-color="var(--track-stop-2)" />
      <stop offset="100%" stop-color="var(--track-stop-3)" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect class="bg" width="512" height="512" rx="112" stroke-width="4" />

  <!-- Fleet Grid Mesh -->
  <g class="grid" stroke-width="1.5">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Converging Tracks forming the 'X' -->
  <g stroke="url(#trackGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <line x1="140" y1="140" x2="372" y2="372" />
    <line x1="140" y1="372" x2="372" y2="140" />
  </g>

  <!-- Fleet Node Discs -->
  <g class="node-disc" stroke-width="8">
    <circle cx="140" cy="140" r="24" />
    <circle cx="372" cy="140" r="24" />
    <circle cx="140" cy="372" r="24" />
    <circle cx="372" cy="372" r="24" />
  </g>

  <!-- Process Status Indicators (Static colors retain semantic meaning in both modes) -->
  <circle cx="140" cy="140" r="8" fill="#16a34a" />
  <circle cx="372" cy="140" r="8" fill="#16a34a" />
  <circle cx="140" cy="372" r="8" fill="#16a34a" />
  <circle cx="372" cy="372" r="8" fill="#d97706" />

  <!-- Central Dashboard Core -->
  <circle class="core-outer" cx="256" cy="256" r="44" stroke-width="8" filter="url(#glow)" />
  <circle class="core-inner" cx="256" cy="256" r="20" />
</svg>
